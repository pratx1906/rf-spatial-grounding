# Deepwave AIR7311 DF node profile. Values marked [flyer] come from the AIR7311 flyer rev 1.2
# (deepwave.ai, 2024); everything else is an ASSUMPTION for simulation and must be confirmed [HUMAN].
device: AIR7311
receiver:
  channels: 4                       # [flyer] dual AD9371, 4x4 MIMO or dual 2x2, phase-coherent capable
  chips: [[0, 1], [2, 3]]            # [flyer] channels 1-2 on AD9371 A, 3-4 on AD9371 B (block diagram)
  freq_range_mhz: [300, 6000]        # [flyer]
  ibw_mhz: 100                       # [flyer] instantaneous bandwidth (125 MSPS)
  adc_bits: 14                       # [flyer]
  noise_figure_db: 3.0               # [flyer]
  gnss_timing_ns_1sigma: 5           # [flyer] to UTC (enables TDOA across nodes)
  cable_loss_db: 2.0                 # assumption
antenna:
  element: omni                     # user direction 2026-10-18: any omnidirectional antenna, 4 elements
  gain_dbi: 0.0                      # assumption (isotropic in the simulation)
  polarization: V                    # assumption
  geometry: square_2x2_horizontal    # 4 omnis on a horizontal square = 4-element circular array
  # one array per design point: side = 0.45 lambda at the band's TOP frequency. Measured 2026-10-18: a side of
  # 0.51 lambda already gives 3.6% wrong bearings for a clean single signal (phase wrap along the sides at
  # endfire); 0.49 lambda gives 0%. Sizing at band centre (first version) put A and C slightly above lambda/2.
  candidate_sides_m:
    A_5g8: 0.023                     # 0.45 lambda @ 5.875 GHz: ambiguity-free at all three bands
    B_2g4: 0.054                     # 0.45 lambda @ 2.4835 GHz
    C_sub1g: 0.145                   # 0.45 lambda @ 928 MHz
impairments:                         # residual errors after calibration (assumptions, swept in the study)
  channel_gain_sigma_db: 0.3
  channel_phase_sigma_deg: 1.0
  interchip_phase_deg_cases: [0.0, 2.0, 10.0]   # AD9371 A vs B residual phase offset
emitter:                             # drone transmitter assumptions (same as the scenario)
  eirp_dbm: 20.0
  signal_bw_mhz: {sub_ghz_868_915: 0.5, ism_2400: 20.0, ism_5800: 20.0}
processing:
  subbands: 16                       # frequency snapshots across the signal bandwidth (multipath decorrelation)
  snapshots_per_subband: 16
  az_step_deg: 0.5
  el_grid_deg: [0, 80, 4]            # horizontal planar array: elevation sign is ambiguous (scan el >= 0)
  detect_snr_db: 6.0
  peak_floor_db: 10.0                # secondary peaks within this of the strongest are reported
front_end:                           # RF phase 2 spectrum model (sim/rf/spectrum.py); ALL assumptions [HUMAN]
  acs_db: 45.0                       # adjacent-channel selectivity of the digital channeliser (in-window, off-channel)
  p1db_in_dbm: -20.0                 # input 1 dB compression: total in-window power above it -> node blocked
  out_of_window_rejection_db: 40.0   # 8-band preselector + LNA chain (Aksha360 RF front-end); value assumed [HUMAN]
  limiter: true                      # limiter / T-R switch protects the RX during own mitigation TX
  p1db_lna_dbm: -10.0                # LNA compression for out-of-window signals (radar pulses, co-located jammers)
  windows_mhz:                       # tuning windows of ibw_mhz (100 MHz); 5.8 GHz ISM (150 MHz) needs two tunings
    sub_ghz_868_915: [895.0]
    ism_2400: [2441.75]
    ism_5800: [5775.0, 5825.0]
array_profiles:                      # Aksha360 antenna strategy (design doc section 7)
  track_b_custom:                    # DEFAULT: compact two-tier 4-element PCB array, lambda-scaled spacing (anti-alias)
    note: "requirement AK-DF-001: <= 5 deg RMS az/el; integrated cal network"
    sides_m: {sub_ghz_868_915: 0.145, ism_2400: 0.054, ism_5800: 0.023}
    element: {gain_dbi: 0.0, ovality_db: 0.5, vswr: 1.5}
  track_a_cots:                      # 4 x SC2-4060-36QAWW1B (P/N 82105984A) on a square: element phi 186 mm
    note: "COTS baseline: 400-6000 MHz, 3-6 dBi, V-pol, vertical beamwidth 25-90 deg, ovality <= +-2 dB, VSWR <= 3.0"
    sides_m: {sub_ghz_868_915: 0.25, ism_2400: 0.25, ism_5800: 0.25}   # physical minimum ~ element diameter + margin
    element: {gain_dbi: 4.5, ovality_db: 2.0, vswr: 3.0, vbw_deg: [25, 90]}
df_calibration:                      # coupling-aware DF steering (sim/df/calibration.py; docs/RESULTS/df_coupling_calibration.md)
  coupling_cal: true                 # ON for new builds: steer with C_hat a, C_hat fitted to simulated cal tones.
                                     # false (or env SCENESCOUT_DF_COUPLING_CAL=0) = nominal steering, as demo v2,
                                     # v21 and the v3 sets built before 2026-10-27. The env var overrides this key.
  # calibration procedure: ALL estimated [HUMAN] to confirm against real AIR7311 / Aksha360 calibration data
  n_tones: 72                        # tones at 5 deg steps around the horizon
  tone_el_deg: 0.0
  tone_snr_db: 40.0                  # per element, per snapshot
  tone_snapshots: 1024
  bearing_sigma_deg: 0.1             # positioner / survey error per tone
  multipath_rel_db: -35.0            # range reflection per tone (random direction and phase)
  drift_rel_db: -40.0                # coupling change between calibration and use (temperature, mast, ageing)
heading_datum:                       # GNSS compass / IMU absolute-bearing reference
  bias_deg_1sigma: 0.5               # assumption [HUMAN]: fixed per node, not removed by calibration
tx:                                  # mitigation TX: AIR7311 TX + external PA + output filters
  max_eirp_dbm: 47.0                 # COTS element max input 100 W (50 dBm) minus losses; assumption [HUMAN]
